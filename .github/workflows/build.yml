name: Build and test

on:
  push:
    branches: [ "main", "cursor/s390x-d276" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Build PC (Linux)
        run: |
          cmake -S ${{github.workspace}} -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Release
          cmake --build ${{github.workspace}}/build

      - name: Tar files
        run: tar -cvf build-pc.tar .

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: build-PC-artifacts
          path: build-pc.tar

  build-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Install Windows toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 mingw-w64-tools

      - name: Build (crosscompile) PC Windows
        run: |
          cmake -S ${{github.workspace}} -B ${{github.workspace}}/build-windows -DCMAKE_TOOLCHAIN_FILE=${{github.workspace}}/windows_x86_64_toolchain.cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build ${{github.workspace}}/build-windows

  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Build (crosscompile) PC Linux ARM64
        run: |
          cmake -S ${{github.workspace}} -B ${{github.workspace}}/build-arm -DCMAKE_TOOLCHAIN_FILE=${{github.workspace}}/arm64_toolchain.cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build ${{github.workspace}}/build-arm

  build-darwin-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build macOS ARM64 (Apple Silicon)
        run: |
          cmake -S ${{github.workspace}} -B ${{github.workspace}}/build-darwin -DUNIVERSAL=FALSE -DCMAKE_OSX_ARCHITECTURES=arm64 -DARM=1 -DCMAKE_BUILD_TYPE=Release
          cmake --build ${{github.workspace}}/build-darwin

  build-darwin-universal:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build macOS Universal (ARM64 + AMD64)
        run: |
          cmake -S ${{github.workspace}} -B ${{github.workspace}}/build -DCMAKE_TOOLCHAIN_FILE=macos_universal_toolchain.cmake -DUNIVERSAL=1 -DCMAKE_BUILD_TYPE=Release
          cmake --build ${{github.workspace}}/build

  build-linux-s390x:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Install s390x toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-s390x-linux-gnu g++-s390x-linux-gnu binutils-s390x-linux-gnu

      - name: Build (crosscompile) PC Linux s390x
        run: |
          cmake -S ${{github.workspace}} -B ${{github.workspace}}/build-s390x -DCMAKE_TOOLCHAIN_FILE=${{github.workspace}}/s390x_toolchain.cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build ${{github.workspace}}/build-s390x

  test-linux-s390x:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Install s390x toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-s390x-linux-gnu g++-s390x-linux-gnu binutils-s390x-linux-gnu
          sudo apt-get install -y qemu-user qemu-user-static libc6-s390x-cross

      - name: Set up QEMU binfmt
        uses: docker/setup-qemu-action@v3
        with:
          platforms: s390x

      - name: Build for s390x (static)
        run: |
          cmake -S ${{github.workspace}} -B ${{github.workspace}}/build-s390x -DCMAKE_TOOLCHAIN_FILE=${{github.workspace}}/s390x_toolchain.cmake -DCMAKE_BUILD_TYPE=Release -DOAPV_APP_STATIC_BUILD=ON
          cmake --build ${{github.workspace}}/build-s390x

      - name: Run tests for s390x with QEMU
        run: |
          cd build-s390x
          export QEMU_LD_PREFIX=/usr/s390x-linux-gnu
          # Increase timeout for QEMU emulation (10s -> 120s)
          # CMake hardcodes TIMEOUT in set_tests_properties, so we modify the generated file
          find . -name "CTestTestfile.cmake" -exec sed -i 's/TIMEOUT "10"/TIMEOUT "120"/g' {} \;
          ctest --output-on-failure

      - name: Upload test results
        uses: actions/upload-artifact@v6
        with:
          name: s390x-LastTest.log
          path: ${{github.workspace}}/build-s390x/Testing/Temporary/LastTest.log
        if: always()

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Build PC (Linux) for coverage
        run: |
          cmake -S ${{github.workspace}} -B ${{github.workspace}}/build -DENABLE_COVERAGE=ON
          cmake --build ${{github.workspace}}/build

      - name: Run tests for PC
        run: |
          cd build
          ctest

      - name: Generate coverage report
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov
          lcov --capture --directory ${{github.workspace}}/build --output-file ${{github.workspace}}/build/coverage.info
          lcov --remove ${{github.workspace}}/build/coverage.info '/usr/*' --output-file ${{github.workspace}}/build/coverage.info
          lcov --list ${{github.workspace}}/build/coverage.info

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: ${{github.workspace}}/build/coverage.info

      - name: Upload test results
        uses: actions/upload-artifact@v6
        with:
          name: LastTest.log
          path: ${{github.workspace}}/build/Testing/Temporary/LastTest.log
